# See https://pre-commit.com for the full documentation.
# Install once per clone:   pre-commit install
# Run against all files:    pre-commit run --all-files
#
# Hooks mirror the CI gates in .github/workflows/ci.yml — so if pre-commit
# passes locally, CI should pass too.

repos:
  # ---- Generic file hygiene ------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---- Ruff lint + format --------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # ---- Mypy (strict-clean modules) ----------------------------------------
  # Only gate on the modules that are already strict-clean. Full-repo mypy
  # would be too noisy on every commit; it runs in CI instead.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: mypy --strict (src/core)
        args: ["--strict"]
        files: ^src/core/
        additional_dependencies:
          - pydantic>=2.0.0

  # ---- Secret scan --------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
