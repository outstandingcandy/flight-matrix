# =================================
# API Configuration
# =================================
api:
  adsb_api_key: "${ADSB_API_KEY}"                                         # ADS-B Exchange API key
  adsb_api_url: "https://adsbexchange-com1.p.rapidapi.com/v2"             # API base URL
  update_interval: 300                                                    # Update interval (seconds)
  timeout: 30                                                             # Request timeout (seconds)

  # Shared secret for POST /api/ingest/*, the write path used by scrapers that
  # cannot reach the database (see src/web/routes/ingest.py). Unset means the
  # ingest endpoints answer 503 — they are never open.
  ingest_token: "${INGEST_API_TOKEN}"
