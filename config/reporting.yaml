# =================================
# Report Service Configuration (separate process)
# =================================
report_service:
  enabled: true                         # Enable report service
  poll_interval: 300                    # Poll interval (seconds) - frequency to check for new reports
  batch_size: 10                        # Reports per batch
  max_retries: 3                        # Retry count on failure
  processing_timeout: 300               # Single report processing timeout (seconds)
  queue_retention_days: 7               # Retention days for completed/failed reports
