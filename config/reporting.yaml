# =================================
# Reporting Configuration (includes filter settings)
# =================================
reporting:
  enable_report_cooldown: true          # Enable report cooldown
  cooldown_hours: 12.0                  # Cooldown time (hours) - default for snapshot_based mode
  min_move_distance_km: 1.0             # Minimum move distance (km), aircraft must move beyond this to generate new report
  cleanup_interval_cycles: 12           # Cleanup interval (cycles)
  max_reports_per_aircraft: 24          # Maximum reports per aircraft
  recent_tracks_count: 10               # Number of recent tracks to show in history summary

  # =================================
  # Dual Mode Filtering Configuration (filter_modes)
  # =================================
  filter_modes:
    # Mode A: Position-based filtering (existing logic)
    snapshot_based:
      enabled: true
      cooldown_hours: 12.0              # Cooldown time (hours)
      cooldown_key_suffix: ""           # Cooldown key suffix (empty=use original key format)
      min_move_distance_km: 1.0         # Minimum move distance (km)
      snapshot_max_age_hours: 1.0       # Only query snapshots from last N hours
      # filters configuration see below in reporting.filters

    # Mode B: Schedule-based filtering (new)
    schedule_based:
      enabled: true
      cooldown_hours: 24.0              # Cooldown time (hours)
      cooldown_key_suffix: ":schedule"  # Independent cooldown key suffix
      lookahead_hours: 8.0              # Query flights N hours ahead
      lookbehind_hours: 0               # Query flights N hours behind (0 = only future flights)
      target_airports:                  # Target airports (IATA codes)
        - PEK     # Beijing Capital
        - PKX     # Beijing Daxing
        - PVG     # Shanghai Pudong
        - SHA     # Shanghai Hongqiao
        - CAN     # Guangzhou Baiyun
        - SZX     # Shenzhen Bao'an
        - CTU     # Chengdu Shuangliu
        - TFU     # Chengdu Tianfu
      flight_types:                     # Flight types of interest
        - arrival                       # Arrivals
        - departure                     # Departures
      reuse_snapshot_filters: true      # Reuse Mode A's custom_sql filter conditions

    # Mode C: Registration match-based filtering
    # Correlates FR24 positions (missing registration) with ADS-B snapshots
    registration_match_based:
      enabled: true
      cooldown_hours: 12.0              # Cooldown time (hours)
      cooldown_key_suffix: ":regmatch"  # Independent cooldown key suffix

      # Match parameters
      time_window_minutes: 3.0          # Time window (±minutes) for matching
      max_distance_km: 5.0              # Maximum distance (km) between positions
      max_altitude_diff_ft: 2000        # Maximum altitude difference (ft)
      max_age_hours: 1.0                # Only match data from last N hours

  # Filter configuration - Determines which recalled aircraft need reports (for snapshot_based mode)
  filters:
    mode: "custom_sql"                    # Only custom_sql mode supported

    # Data quality filter (applied before SQL filter)
    require_position: true                # Filter out aircraft without position info

    # Flight number prefix filter - Watch for special prefix callsigns (VIP/government aircraft)
    # Reference: https://en.wikipedia.org/wiki/Air_transports_of_heads_of_state_and_government
    flight_number_prefixes:
      # === Americas ===
      - "SAM"       # US Special Air Mission - High VIP
      - "EXEC"      # US Executive flights
      - "CFC"       # Canadian Forces (Canforce)
      - "BRS"       # Brazilian Air Force
      - "FAC"       # Colombian Air Force
      - "FAM"       # Mexican Air Force (Fuerza Aerea Mexicana)
      - "ARG"       # Argentina Government

      # === Europe ===
      - "GAF"       # German Air Force
      - "CTM"       # French Air Force (Cotam)
      - "COTAM"     # French Air Force full name
      - "KRF"       # UK Royal Air Force - Royal (Kittyhawk)
      - "RRR"       # UK Royal Air Force - Government (Ascot)
      - "RSD"       # Russia State Aero (Rossiya)
      - "PLF"       # Polish Air Force
      - "HUF"       # Hungarian Air Force
      - "SUI"       # Swiss Air Force
      - "IAM"       # Italian Air Force (Aeronautica Militare)

      # === Asia-Pacific ===
      - "JF"        # Japanese Self-Defense Force
      - "AIC"       # Air India One
      - "PAK"       # Pakistan Air Force
      - "IDN"       # Indonesia
      - "RTAF"      # Royal Thai Air Force
      - "PAF"       # Philippine Air Force
      - "KIW"       # New Zealand (Kiwi)
      - "ASY"       # Royal Australian Air Force (Aussie)

      # === Middle East ===
      - "QAF"       # Qatar Amiri Flight
      - "UAE"       # UAE Government
      - "IAF"       # Israeli Air Force
      - "BAH"       # Bahrain Royal
      - "KUW"       # Kuwait Government

      # === Africa ===
      - "NGR"       # Nigeria Air Force
      - "ETF"       # Ethiopian Air Force
      - "EGF"       # Egyptian Air Force

      # === Central Asia ===
      - "BEC"       # Kazakhstan Berkut Air (Presidential)
      - "TUA"       # Turkmenistan Government

      # === Generic VIP ===
      - "VIP"       # Generic VIP identifier

      # === Uncomment when needed (high volume) ===
      # - "RCH"     # US Air Mobility Command - Military transport
      # - "CNV"     # US Navy
      # - "SVA"     # Saudi Airlines (also royal, but many commercial flights)

    # Custom SQL filter configuration
    # Available fields:
    #   - registration: Registration number (e.g., 'N12345', 'B-1234')
    #   - aircraft_type: Type code (e.g., 'B742', 'IL76', 'A320')
    #   - current_country: Current country (e.g., 'China', 'United States', 'Russia')
    #   - country_of_registration: Registration country (e.g., 'China', 'United States')
    #   - is_military: Is military (1=yes, 0=no)
    #   - flight_number: Flight number (e.g., 'CA123')
    #   - squawk: Transponder code (e.g., '7700'=emergency)
    #
    # SQL syntax examples:
    #   - Equals: field = 'value'
    #   - Contains: field IN ('val1', 'val2')
    #   - Pattern match: field LIKE 'N1%' (starts with N1)
    #   - Combined conditions: AND, OR, ()

