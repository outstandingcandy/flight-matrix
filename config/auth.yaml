# =================================
# Authentication Configuration
# =================================
# Provider resolution follows the DEPLOY_TARGET convention (see deploy.yaml):
#   aws   -> cognito
#   gcp   -> google
#   local -> none (auth bypassed via SKIP_AUTH=true + STAGE=local)
auth:
  provider: ""                              # cognito | google | none

  cognito:
    user_pool_id: "${COGNITO_USER_POOL_ID}"
    client_id: "${COGNITO_CLIENT_ID}"
    client_secret: "${COGNITO_CLIENT_SECRET}"
    domain: "${COGNITO_DOMAIN}"
    callback_url: "${COGNITO_CALLBACK_URL}"
    logout_url: "${COGNITO_LOGOUT_URL}"

  google:
    client_id: "${GOOGLE_OAUTH_CLIENT_ID}"
    client_secret: "${GOOGLE_OAUTH_CLIENT_SECRET}"
    callback_url: "${GOOGLE_OAUTH_CALLBACK_URL}"
    logout_url: "${GOOGLE_OAUTH_LOGOUT_URL}"

    # Google ID tokens carry no group claim (Cognito supplies `cognito:groups`),
    # so group membership is driven from this file. An email that matches no
    # group authenticates successfully but is denied by the group decorators,
    # which is the intended behaviour.
    #
    # Leave allowed_domains empty to accept any verified Google account; set it
    # to e.g. ["example.com"] to restrict logins to that domain.
    allowed_domains: []

    groups:
      admins:
        - "outstandingcandy@gmail.com"
      flight-schedules-viewers:
        - "outstandingcandy@gmail.com"

    # Native-client audiences. iOS / Android sign-ins target their own
    # client_id (Google requires it); listing them here lets
    # `/api/v1/auth/google/native` verify tokens minted for either platform
    # against this same GoogleAuth instance — the signing keys and
    # issuer are the same as the web client's.
    ios_client_id: "${GOOGLE_OAUTH_IOS_CLIENT_ID}"
    android_client_id: "${GOOGLE_OAUTH_ANDROID_CLIENT_ID}"

  # Sign in with Apple — required by App Store Guideline 4.8 whenever an
  # iOS app offers any other third-party sign-in. Server-side we only
  # verify the identityToken the iOS SDK produces; there is no hosted-UI
  # or server-to-server code exchange to configure.
  apple:
    # Apple Service ID or App Bundle ID — whatever the iOS SDK stamps
    # into the `aud` claim. If both an iOS App target and a companion
    # macOS / watchOS target sign in against the same server, put the
    # second Bundle ID in `additional_bundle_ids`.
    bundle_id: "${APPLE_BUNDLE_ID}"
    additional_bundle_ids: []

  # WeChat native + mini-program logins. Two separate AppIDs because
  # WeChat namespaces openids by AppID — the mini-program (`mp`) sits on
  # the Public Platform and the iOS App (`app`) sits on the Open
  # Platform. Cross-app user linkage requires both AppIDs to live under
  # one Open Platform account, which exposes a shared `unionid`.
  wechat:
    mp_appid: "${WECHAT_MP_APPID}"
    mp_appsecret: "${WECHAT_MP_APPSECRET}"
    app_appid: "${WECHAT_APP_APPID}"
    app_appsecret: "${WECHAT_APP_APPSECRET}"
