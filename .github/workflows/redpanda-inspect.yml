name: Inspect redpanda

# One-shot diagnostic. workflow_dispatch only — nothing schedules this.
# Runs a read-only inventory over the VM's deploy-adjacent state so we
# know what to fix (env files, cert dirs, docker volumes, systemd units).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_USER: ${{ vars.GCP_VM_USER }}
        run: |
          gcloud compute ssh "${VM_USER}@${VM_NAME}" \
            --zone="$VM_ZONE" --project="$PROJECT_ID" \
            --ssh-key-expire-after=5m \
            --command='
              set +e
              echo "===== host + user ====="
              hostname; whoami; id
              echo
              echo "===== ~/flight-matrix ====="
              ls -la ~/flight-matrix 2>&1 | head -20
              echo
              echo "===== ~/flight-matrix/.env ====="
              [ -f ~/flight-matrix/.env ] && cat ~/flight-matrix/.env || echo "MISSING"
              echo
              echo "===== /etc/flight-matrix/ ====="
              sudo ls -la /etc/flight-matrix/ 2>&1
              echo "-- env.docker head (masked): --"
              sudo grep -vE "SECRET|PASSWORD|KEY|TOKEN|JWKS" /etc/flight-matrix/env.docker 2>&1 | head -30
              echo
              echo "===== /etc/letsencrypt/live/ ====="
              sudo ls -la /etc/letsencrypt/live/ 2>&1
              echo
              echo "===== docker volumes ====="
              docker volume ls 2>&1
              echo
              echo "===== docker containers (all) ====="
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1
              echo
              echo "===== systemd units for flight-matrix ====="
              systemctl list-units --all --type=service 2>&1 | grep -i flight | head
              echo
              echo "===== listening ports (relevant) ====="
              ss -tlnp 2>&1 | grep -E ":80\s|:443\s|:8443\s|:8000\s|:5433\s" | head
              echo
              echo "===== port 8443 external test ====="
              curl -sk --max-time 3 -o /dev/null -w "https_8443=%{http_code}\n" https://127.0.0.1:8443/ 2>&1
              curl -s --max-time 3 -o /dev/null -w "http_8000_web=%{http_code}\n" http://127.0.0.1:8000/ 2>&1
              echo
              echo "===== host-level caddy? (systemd + processes) ====="
              systemctl list-units --all --type=service 2>&1 | grep -i caddy || echo "no systemd caddy unit"
              ps -eo user,pid,cmd | grep -i "[c]addy" | head
              echo
              echo "===== who owns :443 and :8443 (not just docker) ====="
              sudo ss -tlnp 2>&1 | grep -E ":80\s|:443\s|:8443\s" | head
              echo
              echo "===== collecdex compose file ====="
              find /home /opt /srv -maxdepth 4 -name "docker-compose*.yml" 2>/dev/null | head
              echo "-- Caddyfiles on host --"
              sudo find /etc /home /opt /srv -maxdepth 4 -iname "caddyfile*" 2>/dev/null | head
              echo
              echo "===== /etc/caddy/Caddyfile (host-level) ====="
              sudo cat /etc/caddy/Caddyfile 2>&1
              echo
              echo "===== collecdex Caddyfile ====="
              sudo cat /home/tangjiee/collecdex/deploy/Caddyfile 2>&1
              echo
              echo "===== collecdex compose (ports/networks) ====="
              sudo grep -E "ports:|networks:|image:|container_name:|volumes:" /home/tangjiee/collecdex/deploy/docker-compose.yml 2>&1 | head -40
              echo
              echo "===== docker networks ====="
              docker network ls 2>&1
              echo "-- flight-matrix-caddy connected to --"
              docker inspect flight-matrix-caddy -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} ip={{\$v.IPAddress}}{{println}}{{end}}" 2>&1
              docker inspect deploy-caddy-1 -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} ip={{\$v.IPAddress}}{{println}}{{end}}" 2>&1
              echo
              echo "===== deploy-caddy-1 logs — ACME / flightmatrix / errors ====="
              docker logs --tail=400 deploy-caddy-1 2>&1 | grep -iE "flightmatrix|acme|challenge|obtain|error|tls.issuance|cert" | tail -40
              echo
              echo "===== caddy data (cert store) ====="
              docker exec deploy-caddy-1 sh -c "ls -la /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/ 2>&1" | head
              echo
              echo "===== HTTP-01 challenge path reachable from outside? ====="
              curl -sk --max-time 5 -w "\nstatus=%{http_code} host=%{remote_ip}\n" http://flightmatrix.top/.well-known/acme-challenge/test 2>&1 | tail -8
              echo "===== END ====="
            '
