name: Dependabot auto-merge

# Fires on every ``pull_request`` event. The ``if: github.actor ==
# 'dependabot[bot]'`` gate on the job level ensures human-authored PRs
# are ignored — we don't want the workflow to auto-merge a PR opened
# by a person just because it happens to touch a dep line.
#
# Rule: **every** Dependabot PR gets ``--auto --merge``. The CI matrix
# (ruff / mypy / pytest 3.11 + 3.12 + 3.14 / gitleaks) is what decides
# whether the bump lands — auto-merge waits on those checks and skips
# the merge if any red.
#
# The earlier version of this workflow distinguished major vs
# patch/minor and left majors for human review. That distinction is
# only load-bearing when downstream consumers exist to be broken; on
# this solo-maintainer repo, "CI green → merge" is enough. Anything
# CI actually tests (GH Actions, Python deps, Docker base image with
# the 3.14 matrix in place) gets validated. Anything CI can't cover
# (deploy-only actions like ``webfactory/ssh-agent``) has a next-deploy
# blast radius that's cheap to revert.

on: pull_request

# Auto-merge requires ``pull-requests: write``. Default is read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge every Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        # Even though the routing doesn't switch on update-type any
        # more, keeping the fetch step gives us the ``dependency-names``
        # + ``update-type`` variables for the log line — makes it
        # trivial to eyeball "which action ran for which bump" from the
        # Actions UI without opening the PR.
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Enabling auto-merge for ${{ steps.meta.outputs.dependency-names }} \
            (${{ steps.meta.outputs.update-type }})"
          gh pr merge --auto --merge "$PR_URL"
