name: Tail flight-matrix-web logs

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_USER: ${{ vars.GCP_VM_USER }}
        run: |
          gcloud compute ssh "${VM_USER}@${VM_NAME}" \
            --zone="$VM_ZONE" --project="$PROJECT_ID" \
            --ssh-key-expire-after=5m \
            --command='
              echo "===== flight-matrix-web logs — all lines, last 150 =====";
              sudo docker logs --tail=150 flight-matrix-web 2>&1 | tail -80
            '
