name: Deploy web

# Fires after the ``CI`` workflow finishes successfully on ``main``.
# ``workflow_run`` is the right primitive here: it doesn't re-run
# tests, it just waits for CI to be green on that specific commit and
# then triggers this pipeline. Skips deploy if CI failed.
#
# ``workflow_dispatch`` lets us redeploy the current ``main`` from the
# Actions UI without a new commit — useful for rolling back to the
# last known-good tag by resetting main locally, then clicking
# "Run workflow".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A fast-follow merge shouldn't race the
# previous deploy's ``docker compose up``. ``cancel-in-progress:
# false`` because cancelling mid-``docker build`` leaves a partial
# image on the host.
concurrency:
  group: deploy-web
  cancel-in-progress: false

# ``id-token: write`` is required by ``google-github-actions/auth`` to
# request the OIDC token GitHub Actions mints for this job — the token
# is what proves "this workflow is running for
# outstandingcandy/flight-matrix" to Google's Workload Identity Pool.
# ``contents: read`` is the default; explicit for clarity.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: gcloud compute ssh to redpanda
    runs-on: ubuntu-latest
    # Only run when CI was green (workflow_run) or a human clicked
    # "Run workflow" (workflow_dispatch).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # Deploy path uses ``git fetch`` on the VM itself; we don't
          # need submodules or full history here on the runner.
          submodules: false

      - name: Authenticate to GCP via Workload Identity Federation
        # No JSON key, no long-lived credential. GitHub Actions mints
        # an OIDC token that carries the repo claim; Google's
        # Workload Identity Pool accepts it (guarded by
        # ``attribute.repository == 'outstandingcandy/flight-matrix'``
        # in the pool's attribute-condition), then hands back a
        # short-lived access token that impersonates the
        # ``flight-matrix-deploy`` service account.
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Sync static assets to GCS
        run: |
          gcloud storage rsync -r web_static/ gs://outstandingcandy-flight-matrix-assets/static/ || true

      - name: Deploy
        # Single ``gcloud compute ssh`` session — every command runs
        # on the VM. ``--command`` avoids a shell-escaping dance and
        # uses gcloud's native remote-exec.
        #
        # ``--ssh-key-expire-after=5m`` — the SSH key gcloud uploads
        # to the VM's metadata gets auto-cleaned after 5 minutes so
        # a workflow run's transient credential doesn't linger.
        #
        # ``outstandingcandy@…`` login — the VM is not on OS Login;
        # SSH keys live in project metadata scoped to the
        # ``outstandingcandy`` Linux user which owns
        # ``~/flight-matrix`` and the docker compose stack.
        # ``sudo`` is needed because ``/etc/flight-matrix/env.docker``
        # is ``root:root 0640``.
        env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_USER: ${{ vars.GCP_VM_USER }}
        run: |
          gcloud compute ssh "${VM_USER}@${VM_NAME}" \
            --zone="$VM_ZONE" \
            --project="$PROJECT_ID" \
            --ssh-key-expire-after=5m \
            --command='
              set -euo pipefail

              # Self-heal: if the repo directory does not exist, clone
              # it from origin. Fresh-VM or wiped-home paths land here.
              # Public repo, so no auth needed for the clone itself.
              if [ ! -d "$HOME/flight-matrix" ]; then
                echo "==> ~/flight-matrix missing; cloning from origin"
                git clone --recurse-submodules \
                  https://github.com/outstandingcandy/flight-matrix.git \
                  "$HOME/flight-matrix"
              fi

              cd ~/flight-matrix
              echo "==> git fetch + reset to origin/main"
              git fetch origin main
              git reset --hard origin/main
              git submodule update --init --recursive

              echo "==> docker compose build web"
              sudo docker compose -f docker-compose.web.yml build web

              echo "==> docker compose up -d web"
              sudo docker compose -f docker-compose.web.yml up -d web

              echo "==> waiting for web container to answer /healthz"
              for i in $(seq 1 30); do
                if sudo docker compose -f docker-compose.web.yml exec -T web \
                     curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
                  echo "    ready after ${i}x 2 s"
                  break
                fi
                sleep 2
              done

              echo "==> run migration (idempotent)"
              sudo docker compose -f docker-compose.web.yml exec -T web \
                python scripts/migrate_add_oauth_columns.py || true

              echo "==> check database readiness"
              sudo docker compose -f docker-compose.web.yml exec -T db \
                pg_isready -U aircraft_admin -d aircraft_data

              echo "==> check caddy bypass port (:8444)"
              curl -k -fsS https://127.0.0.1:8444/healthz >/dev/null 2>&1 || echo "caddy bypass port check completed"

              echo "==> post-deploy state:"
              sudo docker compose -f docker-compose.web.yml ps
            '

      - name: Comprehensive smoke & port checks
        # Tests public ports and critical endpoints:
        # - 443 (HTTPS via reverse proxy)
        # - /healthz (liveness probe)
        # - / (homepage rendering)
        # - /airport/PEK (airport detail page)
        # - /aircraft/CU-T1250 (aircraft detail page)
        # - /aircraft-type/A380 (aircraft type page with alias redirect)
        # - /api/v1/aircraft/types (aircraft types list API)
        # - /api/v1/search/suggestions (API endpoint)
        # - /static/css/home.css (static asset delivery)
        run: |
          set -euo pipefail
          echo "==> 1. Check HTTPS /healthz (:443)"
          curl -fsS --max-time 10 https://flightmatrix.top/healthz

          echo "==> 2. Check public homepage"
          RESP_HOME=$(curl -fsS --max-time 10 https://flightmatrix.top/)
          echo "$RESP_HOME" | grep -F "FlightMatrix" >/dev/null

          echo "==> 3. Check airport detail page (/airport/PEK)"
          RESP_PEK=$(curl -fsS --max-time 10 https://flightmatrix.top/airport/PEK)
          echo "$RESP_PEK" | grep -F "PEK" >/dev/null

          echo "==> 4. Check aircraft detail page (/aircraft/CU-T1250)"
          RESP_AC=$(curl -fsS --max-time 10 https://flightmatrix.top/aircraft/CU-T1250)
          echo "$RESP_AC" | grep -F "CU-T1250" >/dev/null

          echo "==> 5. Check aircraft type page (/aircraft-type/A380)"
          RESP_TYPE=$(curl -fsSL --max-time 10 https://flightmatrix.top/aircraft-type/A380)
          echo "$RESP_TYPE" | grep -F "A388" >/dev/null

          echo "==> 6. Check aircraft types API (/api/v1/aircraft/types)"
          RESP_TYPES=$(curl -fsS --max-time 10 https://flightmatrix.top/api/v1/aircraft/types)
          echo "$RESP_TYPES" | grep -F '"success":true' >/dev/null

          echo "==> 7. Check search API (/api/v1/search/suggestions)"
          RESP_API=$(curl -fsS --max-time 10 https://flightmatrix.top/api/v1/search/suggestions)
          echo "$RESP_API" | grep -F '"success":true' >/dev/null

          echo "==> 8. Check static assets (/static/css/home.css)"
          RESP_CSS=$(curl -fsS --max-time 10 https://flightmatrix.top/static/css/home.css)
          echo "$RESP_CSS" | grep -F "home" >/dev/null

          echo "==> All port & endpoint checks passed!"
