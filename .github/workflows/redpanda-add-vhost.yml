name: Add flightmatrix.top vhost to collecdex Caddy

# Adds a ``flightmatrix.top`` reverse-proxy vhost to the collecdex Caddy
# so flight-matrix serves on the shared :443 alongside the collecdex
# subdomains. Idempotent — re-running is a no-op once the block is in.
#
# Steps, in order:
#   1. Timestamped backup of the collecdex Caddyfile.
#   2. Append a flightmatrix.top block, unless the marker is already there.
#   3. Connect ``deploy-caddy-1`` to the ``flight-matrix_default`` network
#      so Caddy can resolve ``flight-matrix-web`` by container name.
#   4. ``caddy validate`` inside the container — fail fast on typos.
#   5. ``caddy reload`` — zero-downtime for both projects.
#   6. Verify: curl https://flightmatrix.top/ over public :443.
#
# Two dispatch inputs:
#   dry_run  — if true, prints what would change and stops before writing.
#   rollback — if true, ignores everything else and restores the most
#              recent .bak file (also disconnects the shared network).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without touching the file"
        type: boolean
        default: false
      rollback:
        description: "Restore the most recent Caddyfile.bak and disconnect the network"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Apply
        env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_USER: ${{ vars.GCP_VM_USER }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ROLLBACK: ${{ github.event.inputs.rollback }}
        run: |
          gcloud compute ssh "${VM_USER}@${VM_NAME}" \
            --zone="$VM_ZONE" --project="$PROJECT_ID" \
            --ssh-key-expire-after=5m \
            --command="
              set -euo pipefail
              CFG=/home/tangjiee/collecdex/deploy/Caddyfile
              CONTAINER=deploy-caddy-1
              NETWORK=flight-matrix_default
              DRY_RUN='${DRY_RUN}'
              ROLLBACK='${ROLLBACK}'

              if [ \"\$ROLLBACK\" = 'true' ]; then
                LAST_BAK=\$(sudo ls -t \${CFG}.bak-* 2>/dev/null | head -1)
                if [ -z \"\$LAST_BAK\" ]; then
                  echo 'no backup to restore'; exit 1
                fi
                echo \"restoring from \$LAST_BAK\"
                sudo cp \"\$LAST_BAK\" \"\$CFG\"
                docker network disconnect \"\$NETWORK\" \"\$CONTAINER\" 2>&1 || true
                docker exec \"\$CONTAINER\" caddy reload --config /etc/caddy/Caddyfile
                echo 'rollback done'
                exit 0
              fi

              if sudo grep -qE '^flightmatrix\\\\.top' \"\$CFG\"; then
                echo 'flightmatrix.top block already present, nothing to do'
              else
                TS=\$(date +%Y%m%d-%H%M%S)
                sudo cp \"\$CFG\" \"\${CFG}.bak-\${TS}\"
                echo \"backed up to \${CFG}.bak-\${TS}\"

                # ``flightmatrix.top`` proxies to the flight-matrix-web container
                # on port 8000 by name. That name resolves because we join
                # deploy-caddy-1 to flight-matrix_default (see below).
                BLOCK='
flightmatrix.top {
    reverse_proxy flight-matrix-web:8000
}
'
                if [ \"\$DRY_RUN\" = 'true' ]; then
                  echo '===== would append ====='
                  echo \"\$BLOCK\"
                  exit 0
                fi

                echo \"\$BLOCK\" | sudo tee -a \"\$CFG\" >/dev/null
                echo 'appended vhost'
              fi

              # Connect (idempotent — the CLI returns non-zero if already
              # attached, hence the || true).
              docker network connect \"\$NETWORK\" \"\$CONTAINER\" 2>&1 || echo '(already connected or connect failed — validate + reload will tell us)'

              echo '===== caddy validate ====='
              docker exec \"\$CONTAINER\" caddy validate --config /etc/caddy/Caddyfile

              echo '===== caddy reload ====='
              docker exec \"\$CONTAINER\" caddy reload --config /etc/caddy/Caddyfile

              echo '===== smoke test ====='
              # ACME may take 15-30 s to issue a fresh cert on first hit.
              for i in \$(seq 1 15); do
                CODE=\$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://flightmatrix.top/ || echo 000)
                echo \"try \$i: https://flightmatrix.top/ = \$CODE\"
                if [ \"\$CODE\" != '000' ] && [ \"\$CODE\" != '502' ] && [ \"\$CODE\" != '503' ]; then
                  break
                fi
                sleep 3
              done
              echo 'done'
            "
