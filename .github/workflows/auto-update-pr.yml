name: Auto-update PR branches

# Fires every time main advances (which is: every merge). Iterates
# every open PR and asks GitHub to fold the new ``main`` into it via
# the ``PUT /repos/{owner}/{repo}/pulls/{n}/update-branch`` API. That
# API creates a merge commit on the PR branch (not a rebase) —
# equivalent effect for branch-protection purposes: the PR is no
# longer ``behind`` main and its auto-merge can fire once CI stays
# green on the merged-in state.
#
# Why this workflow exists at all: branch protection on ``main`` is
# ``strict: true`` (branch must be up-to-date before merge). Without
# auto-update, every merge to main pushes all *other* open PRs into
# ``behind`` state and each one needs a manual rebase to catch up.
# Auto-update closes that loop.
#
# ---- Why GitHub App instead of GITHUB_TOKEN ---------------------
#
# The default ``GITHUB_TOKEN`` GitHub Actions hands each workflow is
# deliberately blocked from triggering downstream workflow runs — a
# safety measure against workflow loops. So when this workflow used
# GITHUB_TOKEN to push merge commits via ``update-branch``, the
# commits *were* pushed but CI didn't re-run on them; PRs stayed
# ``blocked`` waiting for checks that never fired.
#
# Solution: authenticate as a GitHub App instead. App-authored
# pushes DO trigger downstream workflows, because Apps have their
# own identity distinct from the workflow token. The
# ``flight-matrix-ci-bot`` App (see ``scripts/setup-github-app.py``)
# is scoped to just this repo with Contents/Pull-request write.
#
# Merge conflicts on ``update-branch`` return a 422; ``|| true``
# swallows it — the conflict-y PR stays open, no auto-merge fires,
# a human handles it.

on:
  push:
    branches: [main]
  # Manual trigger so you can force-run a sweep without pushing to
  # main. Useful right after enabling this workflow the first time.
  workflow_dispatch:

# The GitHub App token replaces the default token entirely for the
# API call, so the workflow's own permissions barely matter — but
# keep them minimal for defence in depth. ``contents: read`` is
# enough to check out (which this workflow doesn't even do).
permissions:
  contents: read

# Only one sweep at a time. If two merges land in quick succession
# the first sweep might still be running; ``cancel-in-progress: true``
# drops the earlier one since the newer merge already covers its
# scope.
concurrency:
  group: auto-update-pr
  cancel-in-progress: true

jobs:
  update:
    name: Fold main into every open PR
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived (1 h) install token for the App. The
      # ``permissions`` block picks a subset of what the App was
      # granted at install time — least-privilege for this specific
      # workflow. Owner/repositories default to the current repo.
      - name: Get install token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update open PRs
        env:
          # This is the App install token — pushes made with it are
          # authored by the App and DO trigger downstream workflows.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Paginate — a repo with dozens of open PRs would otherwise
          # miss any beyond page 1.
          prs=$(gh api "/repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open PRs — nothing to do."
            exit 0
          fi
          for pr in $prs; do
            echo "==> updating PR #$pr"
            # 422 = "already up to date" OR "merge conflict"; either
            # way we don't want it to break the loop. Print the API's
            # response for the log so a conflict is visible.
            gh api --method PUT "/repos/$REPO/pulls/$pr/update-branch" 2>&1 || true
          done
