<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightMatrix - Track Aircraft Worldwide</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ static_url }}/css/home.css">
</head>
<body>
    <!-- Background overlay -->
    <div class="background-overlay"></div>

    <!-- Main content -->
    <div class="home-container">
        <!-- Logo and title -->
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-plane"></i>
            </div>
            <h1 class="site-title">FlightMatrix</h1>
            <p class="site-subtitle">Track aircraft worldwide</p>
        </div>

        <!-- Search section -->
        <div class="search-section">
            <div class="search-wrapper">
                <div class="search-input-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text"
                           id="unifiedSearch"
                           class="search-input"
                           placeholder="Search aircraft, airports..."
                           autocomplete="off"
                           autofocus>
                    <button type="button" class="search-clear-btn d-none" id="clearSearchBtn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Search dropdown -->
                <div class="search-dropdown d-none" id="searchDropdown">
                    <!-- Loading state -->
                    <div class="dropdown-loading d-none" id="dropdownLoading">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span class="ms-2">Searching...</span>
                    </div>

                    <!-- Search results (shown when typing) -->
                    <div class="dropdown-results d-none" id="dropdownResults">
                        <!-- Airports section -->
                        <div class="result-section" id="airportsResultSection">
                            <div class="section-header">
                                <i class="fas fa-building text-primary"></i>
                                <span>Airports</span>
                            </div>
                            <div class="section-items" id="airportsResultList">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Aircraft section -->
                        <div class="result-section" id="aircraftResultSection">
                            <div class="section-header">
                                <i class="fas fa-plane text-success"></i>
                                <span>Aircraft</span>
                            </div>
                            <div class="section-items" id="aircraftResultList">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Aircraft Types section -->
                        <div class="result-section" id="aircraftTypesResultSection">
                            <div class="section-header">
                                <i class="fas fa-layer-group text-purple"></i>
                                <span>Aircraft Types</span>
                            </div>
                            <div class="section-items" id="aircraftTypesResultList">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- No results message -->
                        <div class="no-results d-none" id="noResults">
                            <i class="fas fa-search-minus"></i>
                            <span>No results found</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popular Cards -->
        <div class="popular-cards">
            <div class="popular-card" id="popularAirportsCard">
                <div class="popular-card-header">
                    <i class="fas fa-plane-departure"></i>
                    <span>热门机场</span>
                </div>
                <div class="popular-card-content" id="popularAirportsContent">
                    <div class="loading-placeholder">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </div>
            </div>
            <div class="popular-card" id="popularAircraftCard">
                <div class="popular-card-header">
                    <i class="fas fa-plane"></i>
                    <span>热门飞机</span>
                </div>
                <div class="popular-card-content" id="popularAircraftContent">
                    <div class="loading-placeholder">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- User section -->
        <div class="user-section">
            {% if current_user %}
                {% if is_admin(current_user) %}
                <a href="/admin" class="user-link admin-link">
                    <i class="fas fa-cog"></i>
                    <span>Admin</span>
                </a>
                {% endif %}
                <div class="user-info">
                    <i class="fas fa-user"></i>
                    <span>{{ current_user.email }}</span>
                </div>
                <a href="/logout" class="user-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            {% else %}
                <a href="/login" class="user-link">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login</span>
                </a>
            {% endif %}
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="{{ static_url }}/js/home.js"></script>

    <!-- Token Refresh -->
    {% include '_token_refresh.html' %}
</body>
</html>
