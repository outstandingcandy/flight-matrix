<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机场情报看板 - Airport Live Board</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ static_url }}/css/style.css">

    <style>
        .flight-status-approaching { background-color: #d4edda !important; }
        .flight-status-departing { background-color: #fff3cd !important; }
        .flight-status-cruising { background-color: #cce5ff !important; }
        .flight-status-ground { background-color: #e2e3e5 !important; }

        .status-badge-approaching { background-color: #28a745; }
        .status-badge-departing { background-color: #ffc107; color: #212529; }
        .status-badge-cruising { background-color: #17a2b8; }
        .status-badge-ground { background-color: #6c757d; }

        .aircraft-type-widebody { font-weight: bold; color: #0d6efd; }
        .aircraft-type-cargo { color: #fd7e14; }
        .aircraft-military { color: #dc3545; font-weight: bold; }

        .airport-search-result {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .airport-search-result:hover {
            background-color: #f8f9fa;
        }

        .stats-card {
            text-align: center;
            padding: 15px;
        }
        .stats-card .number {
            font-size: 2rem;
            font-weight: bold;
        }
        .stats-card .label {
            color: #6c757d;
            font-size: 0.85rem;
        }

        #airportSearchResults {
            position: absolute;
            z-index: 1050;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="fas fa-plane"></i> 飞机追踪系统
                </a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/admin/track">轨迹查询</a>
                    <a class="nav-link active" href="/admin/airport-board">机场看板</a>
                    <a class="nav-link" href="/flight-schedules">航班计划</a>
                    <a class="nav-link" href="/admin/reports"><i class="fas fa-file-alt"></i> 报告</a>
                    <a class="nav-link" href="/admin/users"><i class="fas fa-users"></i> 用户</a>
                    <a class="nav-link" href="/admin/aircraft-query"><i class="fas fa-database"></i> 飞机库</a>
                    <a class="nav-link" href="/admin/scraper-status"><i class="fas fa-robot"></i> 抓取</a>
                </div>
                <div class="navbar-nav ms-auto">
                    {% if current_user %}
                        <span class="navbar-text me-3">
                            <i class="fas fa-user"></i> {{ current_user.email }}
                        </span>
                        <a class="nav-link" href="/logout">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </a>
                    {% else %}
                        <a class="nav-link" href="/login">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <div class="row">
            <!-- Left Panel - Airport Selection -->
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-building"></i> 选择机场</h5>
                    </div>
                    <div class="card-body">
                        <div class="position-relative mb-3">
                            <label for="airportSearch" class="form-label">搜索机场</label>
                            <input type="text" class="form-control" id="airportSearch"
                                   placeholder="输入机场代码或名称...">
                            <div id="airportSearchResults" class="d-none"></div>
                        </div>

                        <div id="selectedAirport" class="d-none">
                            <div class="alert alert-info">
                                <strong id="selectedAirportName"></strong>
                                <br><small id="selectedAirportCode"></small>
                                <button type="button" class="btn-close float-end" id="clearSelectedAirport"></button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="radiusKm" class="form-label">搜索半径 (km)</label>
                            <input type="range" class="form-range" id="radiusKm" min="50" max="1500" value="1000">
                            <div class="text-center"><span id="radiusValue">1000</span> km</div>
                        </div>

                        <button class="btn btn-primary w-100" id="loadNearbyBtn" disabled>
                            <i class="fas fa-search"></i> 查询周边飞机
                        </button>
                    </div>
                </div>

                <!-- Quick Links - Popular Airports -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-star"></i> 热门机场</h6>
                    </div>
                    <div class="card-body p-2">
                        <div class="d-flex flex-wrap gap-1">
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="ZBAA">北京首都</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="ZSPD">上海浦东</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="ZGGG">广州白云</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="ZGSZ">深圳宝安</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="ZUUU">成都双流</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="VHHH">香港</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="RJTT">东京羽田</button>
                            <button class="btn btn-sm btn-outline-secondary quick-airport" data-code="RKSI">首尔仁川</button>
                        </div>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-chart-pie"></i> 当前统计</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="row g-0" id="statsContainer">
                            <div class="col-6 border-end border-bottom">
                                <div class="stats-card">
                                    <div class="number text-success" id="statApproaching">0</div>
                                    <div class="label">进近</div>
                                </div>
                            </div>
                            <div class="col-6 border-bottom">
                                <div class="stats-card">
                                    <div class="number text-warning" id="statDeparting">0</div>
                                    <div class="label">离场</div>
                                </div>
                            </div>
                            <div class="col-6 border-end">
                                <div class="stats-card">
                                    <div class="number text-info" id="statCruising">0</div>
                                    <div class="label">过境</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="stats-card">
                                    <div class="number text-secondary" id="statTotal">0</div>
                                    <div class="label">总计</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Map and Lists -->
            <div class="col-md-9">
                <!-- Map -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-map-marked-alt"></i> 机场周边地图</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" id="refreshMapBtn">
                                <i class="fas fa-sync"></i> 刷新
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="airportMap" style="height: 350px;"></div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body py-2">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <label class="form-label mb-0 me-2">筛选:</label>
                            </div>
                            <div class="col-auto">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="filterWidebody">
                                    <label class="form-check-label" for="filterWidebody">宽体机</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="filterCargo">
                                    <label class="form-check-label" for="filterCargo">货机</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="filterMilitary">
                                    <label class="form-check-label" for="filterMilitary">军用</label>
                                </div>
                            </div>
                            <div class="col-auto ms-auto">
                                <select class="form-select form-select-sm" id="filterStatus" style="width: auto;">
                                    <option value="">全部状态</option>
                                    <option value="approaching">进近</option>
                                    <option value="departing">离场</option>
                                    <option value="cruising">过境</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Aircraft Lists -->
                <div class="row">
                    <!-- Approaching -->
                    <div class="col-md-6 mb-3">
                        <div class="card h-100">
                            <div class="card-header bg-success text-white d-flex justify-content-between">
                                <h6 class="mb-0"><i class="fas fa-plane-arrival"></i> 进近航班</h6>
                                <span class="badge bg-light text-dark" id="approachingCount">0</span>
                            </div>
                            <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="sticky-top bg-light">
                                        <tr>
                                            <th>航班</th>
                                            <th>机型</th>
                                            <th>注册号</th>
                                            <th>高度</th>
                                            <th>距离</th>
                                        </tr>
                                    </thead>
                                    <tbody id="approachingList">
                                        <tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Departing -->
                    <div class="col-md-6 mb-3">
                        <div class="card h-100">
                            <div class="card-header bg-warning d-flex justify-content-between">
                                <h6 class="mb-0"><i class="fas fa-plane-departure"></i> 离场航班</h6>
                                <span class="badge bg-dark" id="departingCount">0</span>
                            </div>
                            <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="sticky-top bg-light">
                                        <tr>
                                            <th>航班</th>
                                            <th>机型</th>
                                            <th>注册号</th>
                                            <th>高度</th>
                                            <th>距离</th>
                                        </tr>
                                    </thead>
                                    <tbody id="departingList">
                                        <tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cruising -->
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between">
                        <h6 class="mb-0"><i class="fas fa-plane"></i> 过境航班</h6>
                        <span class="badge bg-light text-dark" id="cruisingCount">0</span>
                    </div>
                    <div class="card-body p-0" style="max-height: 250px; overflow-y: auto;">
                        <table class="table table-sm table-hover mb-0">
                            <thead class="sticky-top bg-light">
                                <tr>
                                    <th>航班</th>
                                    <th>机型</th>
                                    <th>注册号</th>
                                    <th>高度</th>
                                    <th>速度</th>
                                    <th>距离</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="cruisingList">
                                <tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom JavaScript -->
    <script src="{{ static_url }}/js/airport_board.js"></script>

    <!-- Token Refresh -->
    {% include '_token_refresh.html' %}
</body>
</html>
