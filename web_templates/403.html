<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Access Denied</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Site CSS -->
    <link rel="stylesheet" href="{{ static_url }}/css/style.css">
    <link rel="stylesheet" href="{{ static_url }}/css/403.css">
</head>
<body>
    <div class="error-container">
        <div class="error-card card shadow">
            <div class="card-body p-5">
                <div class="error-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="error-code">403</div>
                <h2 class="mb-3">Access denied</h2>
                <p class="text-muted mb-4">
                    {% if message %}
                        {{ message }}
                    {% else %}
                        You do not have permission to access this page. Please sign in and try again.
                    {% endif %}
                </p>
                <div class="d-grid gap-2">
                    <a href="/login" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> Sign in
                    </a>
                    <a href="/flight-schedules" class="btn btn-outline-secondary">
                        <i class="fas fa-plane"></i> Back to flight schedules
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
